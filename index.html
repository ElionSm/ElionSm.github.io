<style>
  :root {
    --accent: #E8762C;
    --accent-dark: #B35411;
    --ink: #1A222B;
    --muted: #4E5A63;
    --rule: #DCE2E7;
    --ground: #F6F7F8;
    --card: #FFFFFF;
    --sans: "Lato", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-dark: #F0A06A;
      --ink: #E9EDF0;
      --muted: #A9B4BC;
      --rule: #2F3A44;
      --ground: #12181E;
      --card: #1A222B;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
  }

  main { width: 100%; max-width: 440px; }

  header {
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 3px solid var(--accent);
  }
  h1 {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.01em;
    line-height: 1.05;
    text-transform: uppercase;
  }
  h1 strong { font-weight: 700; }
  .role {
    margin-top: 8px;
    font-weight: 600;
    color: var(--accent-dark);
  }

  .cv {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .cv h2 {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .actions { display: flex; gap: 10px; }
  .actions a {
    flex: 1;
    display: block;
    text-align: center;
    padding: 12px 10px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
  }
  .view { background: var(--accent); color: #1A222B; }
  .download { border: 1.5px solid var(--accent); color: var(--accent-dark); }
  .actions a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  footer {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 0.95rem;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent-dark); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>

    <a href="https://www.linkedin.com/in/samuel-boisneault">LinkedIn</a>
